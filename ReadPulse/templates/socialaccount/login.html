{% load static %}
<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadPulse Social Login</title>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--bg)}.auth-card{background:white;padding:2rem;border-radius:14px;box-shadow:var(--shadow-md);max-width:420px;text-align:center}.btn{display:block;width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;text-decoration:none}</style>
</head><body><div class="auth-card">
<h2>Confirm Sign In</h2>
<p>You are about to sign in using {{ provider.name }}.</p>
<form method="post">{% csrf_token %}<button class="btn" type="submit">Continue</button></form>
</div></body></html>
