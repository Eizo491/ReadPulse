{% extends "books/base.html" %}
{% load static %}

{% block title %}Book Requests – ReadPulse{% endblock %}

{% block content %}
<div class="topbar">
  <div>
    <div class="topbar-title">Book Requests</div>
    <div class="topbar-subtitle">Manage borrow and swap requests</div>
  </div>
</div>

<div class="page-content">

  <!-- Tabs -->
  <div class="req-tabs">
    <button class="req-tab active" data-tab="my-requests">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      My Requests
      <span class="req-tab-badge" id="my-req-badge" hidden></span>
    </button>
    <button class="req-tab" data-tab="incoming">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.69h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 10a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Incoming Requests
      <span class="req-tab-badge" id="incoming-badge" hidden></span>
    </button>
  </div>

  <!-- My Requests Panel -->
  <div id="panel-my-requests" class="req-panel">
    <div id="my-requests-area">
      <div class="status-msg"><span class="status-icon">⏳</span><p>Loading your requests…</p></div>
    </div>
  </div>

  <!-- Incoming Requests Panel -->
  <div id="panel-incoming" class="req-panel" hidden>
    <div id="incoming-area">
      <div class="status-msg"><span class="status-icon">⏳</span><p>Loading incoming requests…</p></div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/main.js' %}"></script>
<script src="{% static 'js/requests.js' %}"></script>
{% endblock %}
