{% extends "books/base.html" %}
{% load static %}

{% block title %}Book Details – ReadPulse{% endblock %}

{% block content %}
<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="javascript:history.back()" class="back-btn" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <div>
      <div class="topbar-title" id="detail-heading">Book Details</div>
      <div class="topbar-subtitle">Full information about this book</div>
    </div>
  </div>
</div>

<div class="page-content">
  <div id="detail-area">
    <!-- Loading skeleton -->
    <div class="detail-skeleton">
      <div class="detail-skeleton-cover"></div>
      <div class="detail-skeleton-body">
        <div class="skeleton-line" style="height:28px;width:70%;margin-bottom:10px;"></div>
        <div class="skeleton-line" style="width:40%;margin-bottom:20px;"></div>
        <div class="skeleton-line" style="width:100%;margin-bottom:8px;"></div>
        <div class="skeleton-line" style="width:100%;margin-bottom:8px;"></div>
        <div class="skeleton-line" style="width:80%;"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const BOOK_ID = "{{ google_books_id|escapejs }}";
</script>
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
