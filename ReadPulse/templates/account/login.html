{% load socialaccount %}{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadPulse – Login</title>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: var(--bg);
  margin: 0;
}

.auth-wrap {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.auth-logo {
  text-align: center;
  margin-bottom: 28px;
}

.auth-logo .logo-mark {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  text-decoration: none;
}

.auth-logo .logo-mark span {
  color: var(--accent);
}

.auth-logo .logo-sub {
  display: block;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 3px;
}

.auth-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 36px 36px 32px;
}

.auth-card h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 24px;
  text-align: center;
}

/* Messages */
.auth-messages {
  margin-bottom: 16px;
}
.auth-msg {
  background: var(--accent-light);
  border: 1px solid #f5d0be;
  border-radius: var(--radius-sm);
  padding: 9px 13px;
  font-size: 0.83rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.auth-msg.error {
  background: #fdecea;
  border-color: #f5c6c6;
  color: #b03a2e;
}

/* Fields */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.field-input-wrap {
  position: relative;
}

.field-input-wrap input {
  width: 100%;
  padding: 11px 40px 11px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
}

.field-input-wrap input::placeholder {
  color: var(--text-muted);
}

.field-input-wrap input:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(196,112,79,0.12);
}

.field-icon {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
}

/* Row: remember + forgot */
.auth-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}

.remember input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
  border-radius: 3px;
}

.forgot {
  font-size: 0.85rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s;
}
.forgot:hover { color: var(--accent-hover); text-decoration: underline; }

/* Buttons */
.btn-login {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.2px;
  transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
  box-shadow: 0 2px 8px rgba(196,112,79,0.25);
  margin-bottom: 16px;
}
.btn-login:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(196,112,79,0.35);
}
.btn-login:active { transform: translateY(0); }

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider span {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  padding: 11px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.18s, border-color 0.18s;
  margin-bottom: 20px;
}
.btn-google:hover {
  background: var(--surface-hover);
  border-color: var(--text-muted);
}

.auth-footer {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-secondary);
  border-top: 1px solid var(--border-light);
  padding-top: 18px;
}
.auth-footer a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}
.auth-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-wrap">

  <div class="auth-logo">
    <a class="logo-mark" href="/">Read<span>Pulse</span></a>
    <span class="logo-sub">Your reading companion</span>
  </div>

  <div class="auth-card">
    <h1>Welcome back</h1>

    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}

      <div class="field">
        <label for="id_login">Username or Email</label>
        <div class="field-input-wrap">
          <input type="text" name="login" id="id_login" placeholder="Enter your username or email" required autocomplete="username">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="id_password">Password</label>
        <div class="field-input-wrap">
          <input type="password" name="password" id="id_password" placeholder="Enter your password" required autocomplete="current-password">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="auth-meta">
        <label class="remember">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a class="forgot" href="{% url 'account_reset_password' %}">Forgot password?</a>
      </div>

      <button class="btn-login" type="submit">Sign In</button>
    </form>

    <div class="divider"><span>or</span></div>

    <a class="btn-google" href="{% provider_login_url 'google' %}">
      <svg width="17" height="17" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'account_signup' %}">Register</a>
    </div>
  </div>

</div>
</body>
</html>
