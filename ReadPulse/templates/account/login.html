{% load socialaccount %}{% load static %}
<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadPulse Login</title>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--bg);}
.auth-card{background:var(--surface);padding:2rem;border-radius:var(--radius);box-shadow:var(--shadow-md);width:100%;max-width:420px}
.auth-card h1{text-align:center;margin-bottom:1rem}
.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
.btn{display:block;width:100%;padding:12px;background:var(--accent);color:#fff;text-decoration:none;border:none;border-radius:8px;cursor:pointer}
.alt{background:var(--surface-hover);color:var(--text-primary);margin-top:10px;text-align:center}
p{text-align:center;margin:10px 0}
</style></head>
<body><div class="auth-card">
<h1>ReadPulse</h1>
<form method="post" action="{% url 'account_login' %}">
{% csrf_token %}
<input class="input" type="text" name="login" placeholder="Username or Email" required>
<input class="input" type="password" name="password" placeholder="Password" required>
<button class="btn" type="submit">Login</button>
</form>
<p>or</p>
<a class="btn alt" href="{% provider_login_url 'google' %}">Continue with Google</a>
<p><a href="{% url 'account_signup' %}">Create account</a></p>
</div></body></html>
